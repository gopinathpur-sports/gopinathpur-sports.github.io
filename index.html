  else if(k==='kabaddi')s=R(60,200,280,400)+Ln(60,400,340,400)+Ln(60,330,340,330)+Ln(60,470,340,470)+Ln(60,260,340,260)+Ln(60,540,340,540)+C(200,400,40);

let tt;
function toast(t,b){const el=$('#toast');el.innerHTML='<b>'+esc(t)+'</b>'+(b?'<br>'+esc(b):'');el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',3800)}
function push(t,b,quiet){
  if(Date.now()-S.mute<1500)return;
  if(!quiet)toast(t,b);
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'&&ls.get('gs_nf')!=='off'){
    const o={body:b,icon:'icon-192.png',badge:'icon-192.png'};
    (navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>r?r.showNotification(t,o):new Notification(t,o)).catch(()=>{});
  }
}
function diff(key,list){
  const first=!S.seen[key];S.seen[key]=1;if(first)return;const old=S[key];
  if(key==='matches')list.forEach(m=>{const o=old.find(x=>x.id===m.id),sc=m.home+' '+bn(m.hs||0)+'–'+bn(m.as||0)+' '+m.away;
    if(!o)push('🆕 নতুন ম্যাচ',m.home+' বনাম '+m.away+(m.when?' — '+m.when:''));
    else if(o.status!==m.status&&m.status==='live')push('🔴 ম্যাচ শুরু',sc);
    else if(o.status!==m.status&&m.status==='done')push('🏁 ম্যাচ শেষ',sc);
    else if((o.hs!==m.hs||o.as!==m.as)&&m.status!=='upcoming'){S.bump[m.id]=Date.now();push('⚽ স্কোর আপডেট',sc)}});
  if(key==='notices')list.forEach(n=>{if(!old.find(x=>x.id===n.id))push('📢 নতুন ঘোষণা',n.text)});
  if(key==='chat')list.forEach(c=>{if(!old.find(x=>x.id===c.id)&&c.uid!==S.me.id){
    if(S.cs.open&&S.cs.room===(c.room||'all'))return;
    push('💬 '+(c.name||'সদস্য'),c.text||'📷 ছবি',S.cs.open)}});
}
async function toggleNotif(){
  if(!('Notification' in window)){toast('এই ব্রাউজারে নোটিফিকেশন সুবিধা নেই','iPhone-এ আগে অ্যাপটি Home Screen-এ ইনস্টল করুন');return}
  if(Notification.permission==='granted'){const off=ls.get('gs_nf')!=='off';ls.set('gs_nf',off?'off':'on');toast(off?'🔕 নোটিফিকেশন বন্ধ':'🔔 নোটিফিকেশন চালু');render();return}
  if(Notification.permission==='denied'){toast('ব্রাউজারের সেটিংস থেকে নোটিফিকেশন "Allow" করুন');return}
  const p=await Notification.requestPermission();ls.set('gs_nf','on');toast(p==='granted'?'🔔 নোটিফিকেশন চালু হয়েছে':'অনুমতি দেওয়া হয়নি');render();
}

async function write(fn){

function listTable(){
  const T={};
  S.matches.filter(m=>m.sport==='football').forEach(m=>{
    [m.home,m.away].forEach(n=>{if(!T[n])T[n]={n,p:0,w:0,d:0,l:0,gf:0,ga:0,pt:0}});
    if(m.status!=='done')return;
    const h=T[m.home],a=T[m.away],hs=m.hs||0,as=m.as||0;
    h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
    if(hs>as){h.w++;a.l++;h.pt+=3}else if(hs<as){a.w++;h.l++;a.pt+=3}else{h.d++;a.d++;h.pt++;a.pt++}
  });
  const r=Object.values(T).sort((x,y)=>y.pt-x.pt||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
  if(!r.length)return '<div class="empty">ফুটবল ম্যাচের ফল যোগ হলে টেবিল নিজে তৈরি হবে</div>';
  return `<div class="card"><b>⚽ ফুটবল পয়েন্ট টেবিল</b><div class="mut" style="text-align:left">ম্যাচ "শেষ" করলেই অটো হিসাব (জয় ৩, ড্র ১)</div><table style="margin-top:8px"><tr><th>#</th><th>টিম</th><th>খেলা</th><th>জয়</th><th>ড্র</th><th>হার</th><th>গোল ±</th><th>পয়েন্ট</th></tr>

   :`<div class="cf"><button class="go" data-a="login" style="width:100%">G&nbsp; সাইন ইন করে চ্যাটে যোগ দিন</button></div>`;
  crep();
}
function openChat(room){
  S.cs.open=true;S.cs.room=room||'all';S.cs.stick=true;S.cs.reply=null;
  let el=$('#chat');if(!el){el=document.createElement('div');el.id='chat';el.className='chat';document.body.appendChild(el)}
  el.innerHTML=`<div class="ch"><button class="ic" data-a="cclose">←</button><div class="ct"><b id="ct"></b><small id="cs2"></small></div><span id="crm"></span><button class="ic" data-a="cname" title="নাম বদলান">✎</button></div><div id="cmsgs" class="cm"></div><div class="cq">${QUICK.map(q=>`<button class="chip" data-a="quick" data-v="${q}">${q}</button>`).join('')}</div><div id="crep"></div><div id="cin"></div>`;
  chatFoot();render();
}
function sendChat(text,img){
  const o={text,name:S.me.name,uid:S.me.id,photo:S.me.photo||'',ts:Date.now(),room:S.cs.room};
  if(img)o.img=img;if(S.cs.reply)o.reply=S.cs.reply;
  S.cs.reply=null;S.cs.img='';S.cs.stick=true;crep();
  write(()=>S.db.collection('chat').add(o));
}
function needName(){if(!S.user){openLogin();return true}if(!S.me.name){S.sheet={kind:'name',d:{name:S.user.displayName||''}};sheet();return true}return false}
function readImg(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ---------- শিট (এডিট, লগইন, নাম, অ্যাডমিন) ---------- */
function openSheet(col,id){
  const d=col==='settings'?cfg():id?(S[col].find(x=>x.id===id)||{}):{};
  S.sheet={col,id,photo:d.photo||'',d,err:''};sheet();
}
function openLogin(){S.sheet={kind:'login',err:''};sheet()}
function adList(){
  const el=$('#adl');if(!el)return;
  const l=S.admins.filter(a=>!OWNER.includes(a.id));
  el.innerHTML=l.length?l.map(a=>`<div class="row"><div>${esc(a.id)}${a.by?`<small>যোগ করেছেন: ${esc(a.by)}</small>`:''}</div>${delBtn('admins',a.id)}</div>`).join(''):'<div class="empty">এখনো কোনো অতিরিক্ত অ্যাডমিন নেই</div>';
}
function sheet(){
  const sh=S.sheet,el=$('#sheet');
  if(!sh){el.innerHTML='';return}
  const err=sh.err?`<div class="err">${esc(sh.err)}</div>`:'';
  if(sh.help){el.innerHTML=`<div class="ov" data-a="shx"><div class="sh"><b style="font-size:17px">📲 ফোনে ইনস্টল করুন</b>
  <div style="margin:12px 0;line-height:1.9"><b>Android (Chrome):</b><br>উপরের ডানে ⋮ মেনু → <b>"Install app"</b> বা <b>"Add to Home screen"</b><br><br><b>iPhone (Safari):</b><br>নিচের শেয়ার বাটন ⬆ → <b>"Add to Home Screen"</b> → Add<br><br><b>কম্পিউটার (Chrome):</b><br>ঠিকানার ডানে ইনস্টল আইকন ⊕</div><button class="go" data-a="shclose" style="width:100%">বুঝেছি</button></div></div>`;return}
  if(sh.kind==='login'){el.innerHTML=`<div class="ov" data-a="shx"><div class="sh"><b style="font-size:17px">🔐 সাইন ইন</b><p class="mut2">Google দিয়ে সাইন ইন করলে চ্যাটে মেসেজ লিখতে ও রিঅ্যাকশন দিতে পারবেন। অ্যাডমিনরাও এখান থেকেই ঢোকেন।</p>${err}<button class="go" data-a="dogoogle" style="width:100%">G&nbsp; Google দিয়ে সাইন ইন</button><button class="ghost" data-a="shclose" style="width:100%;margin-top:8px">বাতিল</button></div></div>`;return}
  if(sh.kind==='name'){el.innerHTML=`<div class="ov" data-a="shx"><div class="sh"><b style="font-size:17px">👤 চ্যাটে কোন নামে দেখাবে?</b><label>আপনার নাম</label><input id="sh-nm" maxlength="40" value="${esc(sh.d.name)}"><div class="mut2">যেমন: রাকিব (পূর্বপাড়া)। পরে চ্যাটের ✎ বাটনে বদলাতে পারবেন।</div>${err}<div class="bar2" style="margin-top:12px"><button class="ghost" data-a="shclose">বাতিল</button><button class="go" data-a="savename">সেভ করুন</button></div></div></div>`;return}
  if(sh.kind==='acct'){const role=S.owner?'মূল অ্যাডমিন':S.admin?'অ্যাডমিন':'সদস্য';el.innerHTML=`<div class="ov" data-a="shx"><div class="sh"><b style="font-size:17px">👤 ${esc(S.me.name||S.user.displayName||'আমার অ্যাকাউন্ট')}</b><p class="mut2">${esc(S.user.email||'')}<br>ভূমিকা: <b>${role}</b></p><div class="bar2"><button class="ghost" data-a="cname">✎ নাম বদলান</button><button class="ghost red" data-a="dosignout">সাইন আউট</button></div><button class="go" data-a="shclose" style="width:100%">বন্ধ করুন</button></div></div>`;return}
  if(sh.kind==='admins'){el.innerHTML=`<div class="ov" data-a="shx"><div class="sh"><b style="font-size:17px">👑 অ্যাডমিন ম্যানেজ</b><p class="mut2">যাকে অ্যাডমিন করতে চান তার Google ইমেইল দিন। সে ওই ইমেইল দিয়ে সাইন ইন করলেই অ্যাডমিন ফিচার পাবে। এই ক্ষমতা শুধু আপনার (মূল অ্যাডমিনের)।</p>
  <div class="form"><input id="ad-e" type="email" placeholder="নতুন অ্যাডমিনের Gmail"><button class="go" data-a="addadmin">＋ অ্যাডমিন করুন</button></div>${err}<div id="adl" style="margin-top:10px"></div><button class="ghost" data-a="shclose" style="width:100%;margin-top:10px">বন্ধ করুন</button></div></div>`;adList();return}
  const def=FORMS[sh.col];
  const fld=def.f.map(([k,lb,ty,op])=>{
    const v=sh.d[k]==null?'':sh.d[k];
    if(ty==='photo')return `<label>${lb}</label><div class="ph">${sh.photo?`<img class="pa" id="sh-prev" src="${safeUrl(sh.photo)}">`:`<div class="pa" id="sh-prev">+</div>`}<div style="flex:1"><input id="sh-${k}" type="file" accept="image/*">${sh.photo?'<button class="mini red" data-a="rmphoto" style="margin-top:6px">ছবি মুছুন</button>':''}</div></div>`;
    if(ty==='sel')return `<label>${lb}</label><select id="sh-${k}">${op.map(o=>`<option value="${o[0]}" ${(v||op[0][0])===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    if(ty==='area')return `<label>${lb}</label><textarea id="sh-${k}" rows="3">${esc(v)}</textarea>`;
    return `<label>${lb}</label><input id="sh-${k}" ${ty==='num'?'type="number" inputmode="numeric"':''} value="${esc(v)}">`;
  }).join('');
  el.innerHTML=`<div class="ov" data-a="shx"><div class="sh"><b style="font-size:17px">${sh.id||sh.col==='settings'?'✎ এডিট':'＋ নতুন'}: ${def.t}</b>${fld}${err}
  <div class="bar2" style="margin-top:14px"><button class="ghost" data-a="shclose">বাতিল</button><button class="go" data-a="shsave">সেভ করুন</button></div></div></div>`;
}
function saveSheet(){
  const sh=S.sheet,def=FORMS[sh.col],o={};
  for(const [k,,ty] of def.f){const el=$('#sh-'+k);if(ty==='photo')o[k]=sh.photo||'';else if(ty==='num'){const v=el.value.trim();o[k]=v===''?'':+v}else o[k]=el.value.trim()}
  if(def.req.some(k=>o[k]===''||o[k]==null||(k==='amount'&&!(o.amount>0)))){sh.err='দরকারি ঘর পূরণ করুন';sheet();return}
  if(sh.col==='ledger')o.amount=Math.round(o.amount);
  if(sh.col==='matches'){if(o.hs==='')o.hs=0;if(o.as==='')o.as=0}
  const {col,id}=sh;S.sheet=null;sheet();
  write(async()=>{
    if(col==='settings')await S.db.doc('settings/site').set(o);
    else if(id)await S.db.doc(col+'/'+id).update(o);
    else{o.ts=Date.now();if(col==='ledger')o.by=S.me.name||'অ্যাডমিন';await S.db.collection(col).add(o)}
  });
}
function readPhoto(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const z=240,c=document.createElement('canvas');c.width=c.height=z;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);r(c.toDataURL('image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(file)})}
document.addEventListener('change',async e=>{
  if(e.target.id==='sh-photo'&&e.target.files[0]&&S.sheet&&FORMS[S.sheet.col]){S.sheet.photo=await readPhoto(e.target.files[0]);const keep={};for(const [k,,ty] of FORMS[S.sheet.col].f){if(ty!=='photo'){const x=$('#sh-'+k);if(x)keep[k]=x.value}}Object.assign(S.sheet.d,keep);sheet()}
  if(e.target.id==='cfile'&&e.target.files[0]){
    try{let d=await readImg(e.target.files[0],640,.65);if(d.length>190000)d=await readImg(e.target.files[0],420,.5);
      if(d.length>190000)toast('ছবিটি অনেক বড়, ছোট ছবি দিন');else{S.cs.img=d;crep()}}catch(x){toast('ছবি পড়া যায়নি')}
    e.target.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci'){e.preventDefault();const b=document.querySelector('[data-a="csend"]');if(b)b.click()}});

/* ---------- ক্লিক ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v,m=S.matches.find(x=>x.id===id);
  if(a==='shx'&&e.target!==b)return;
  if(a==='theme'){const r=document.documentElement,n=r.dataset.theme==='light'?'dark':'light';r.dataset.theme=n;ls.set('gs_th',n)}
  else if(a==='tab'){S.tab=v;S.err='';formHtml();render();scrollTo(0,0)}
  else if(a==='sp'){S.sport=v;render()}
  else if(a==='install'){if(S.dip){S.dip.prompt();S.dip=null}else{S.sheet={help:true};sheet()}}
  else if(a==='ibx'){ls.set('gs_ib','x');render()}
  else if(a==='notif')toggleNotif();
  else if(a==='login'){if(S.user){S.sheet={kind:'acct'};sheet()}else openLogin()}
  else if(a==='dogoogle'){
    if(S.sheet)S.sheet.err='';
    S.google().catch(x=>{
      const c=x&&x.code;
      if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){S.googleRedirect().catch(()=>{});return}
      if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
      if(S.sheet){S.sheet.err=c==='auth/unauthorized-domain'?'Firebase-এ Authorized domains-এ এই সাইটের ঠিকানা যোগ করুন':c==='auth/operation-not-allowed'?'Firebase-এ Google সাইন ইন চালু করুন':'Google লগইন হয়নি, আবার চেষ্টা করুন';sheet()}
    });
  }
  else if(a==='dosignout'){S.sheet=null;sheet();S.signOut()}
  else if(a==='cname'){S.sheet={kind:'name',d:{name:S.me.name||(S.user&&S.user.displayName)||''}};if(!S.user){openLogin();return}sheet()}
  else if(a==='savename'){const n=$('#sh-nm').value.trim();if(!n){S.sheet.err='নাম লিখুন';sheet();return}
    S.me.name=n;S.sheet=null;sheet();write(()=>S.db.doc('users/'+S.me.id).set({name:n}));chatFoot()}
  else if(a==='admins'&&S.owner){S.sheet={kind:'admins',err:''};sheet()}
  else if(a==='addadmin'){const em=$('#ad-e').value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){S.sheet.err='সঠিক ইমেইল দিন';sheet();return}
    S.sheet.err='';write(()=>S.db.doc('admins/'+em).set({email:em,by:S.me.name||'',ts:Date.now()}));const x=$('#ad-e');if(x)x.value=''}
  else if(a==='new')openSheet(b.dataset.c);
  else if(a==='edit')openSheet(b.dataset.c,id);
  else if(a==='esite')openSheet('settings','site');
  else if(a==='shclose'||a==='shx'){S.sheet=null;sheet()}
  else if(a==='shsave')saveSheet();
  else if(a==='rmphoto'){S.sheet.photo='';sheet()}
  else if(a==='g'&&m){const f=b.dataset.s,nv=Math.max(0,(m[f]||0)+(+b.dataset.d));write(()=>S.db.doc('matches/'+id).update({[f]:nv,hs:f==='hs'?nv:(m.hs||0),as:f==='as'?nv:(m.as||0),status:m.status==='upcoming'?'live':m.status}))}
  else if(a==='st'&&m)write(()=>S.db.doc('matches/'+id).update({status:v,hs:m.hs||0,as:m.as||0}));
  else if(a==='del'){const c=b.dataset.c,k=c+id;if(S.del===k){S.del=null;write(()=>S.db.doc(c+'/'+id).delete())}else{S.del=k;render()}}
  /* চ্যাট */
  else if(a==='chat')openChat('all');
  else if(a==='mchat')openChat(id);
  else if(a==='croom'){S.cs.room='all';S.cs.stick=true;render()}
  else if(a==='cclose'){S.cs.open=false;S.cs.reply=null;const c=$('#chat');if(c)c.remove();render()}
  else if(a==='cimg'){if(needName())return;const f=$('#cfile');if(f)f.click()}
  else if(a==='rmreply'){S.cs.reply=null;crep()}
  else if(a==='rmimg'){S.cs.img='';crep()}
  else if(a==='mention'){const i=$('#ci');if(i&&b.dataset.n){i.value+='@'+b.dataset.n.replace(/\s+/g,'_')+' ';i.focus()}}
  else if(a==='reply'){if(needName())return;const x=S.chat.find(y=>y.id===id);if(!x)return;S.cs.reply={id,name:x.name||'সদস্য',text:(x.text||'📷 ছবি').slice(0,60)};crep();const i=$('#ci');if(i)i.focus()}
  else if(a==='react'){if(!S.user){openLogin();return}const x=S.chat.find(y=>y.id===id),k=b.dataset.k;if(!x)return;
    const on=!((x.reacts&&x.reacts[k])||[]).includes(S.me.id);write(()=>S.db.doc('chat/'+id).react(k,S.me.id,on))}
  else if(a==='csend'||a==='quick'){
    if(needName())return;
    const inp=$('#ci'),t=a==='quick'?v:(inp?inp.value.trim():'');
    if(!t&&!(a==='csend'&&S.cs.img))return;
    sendChat(t,a==='csend'?S.cs.img:'');if(a==='csend'&&inp)inp.value='';
  }
});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.dip=e;render()});

/* ---------- শুরু ---------- */
(async()=>{
  document.documentElement.dataset.theme=ls.get('gs_th')||'dark';
  if(!ls.get('gs_cs'))ls.set('gs_cs',Date.now());
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  formHtml();render();
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
    S.db=fsDb(F.getFirestore(app),F);
    S.google=()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider());
    S.googleRedirect=()=>Au.signInWithRedirect(auth,new Au.GoogleAuthProvider());
    S.signOut=()=>Au.signOut(auth);
    let unA=null;
    Au.onAuthStateChanged(auth,async u=>{
      if(u&&u.isAnonymous){await Au.signOut(auth);return}
      S.user=u;S.me.id=u?u.uid:null;S.me.photo=(u&&u.photoURL)||'';S.me.name='';
      const em=u&&u.email?u.email.toLowerCase():'';
      S.owner=!!(em&&u.emailVerified&&OWNER.includes(em));S.admin=S.owner;
      if(S.sheet&&S.sheet.kind==='login')S.sheet=null;
      if(unA){unA();unA=null;S.admins=[]}
      formHtml();render();sheet();chatFoot();
      if(!u)return;
      try{
        const p=await S.db.doc('users/'+u.uid).get();S.me.name=(p&&p.name)||'';
        if(!S.admin&&em){const ad=await S.db.doc('admins/'+em).get();S.admin=!!ad}
        if(S.owner)unA=sub('admins','admins');
      }catch(x){}
      if(!S.me.name&&!S.sheet){S.sheet={kind:'name',d:{name:u.displayName||''}};}
      formHtml();render();sheet();chatFoot();
    });
    sub('matches','matches',S.db.collection('matches').orderBy('ts','asc').limit(300));
    sub('ledger','ledger',S.db.collection('ledger').orderBy('ts','asc').limit(500));
    sub('notices','notices',S.db.collection('notices').orderBy('ts','desc').limit(5));
    sub('chat','chat',S.db.collection('chat').orderBy('ts','desc').limit(150));
    sub('players','players',S.db.collection('players').orderBy('ts','asc').limit(200));
    sub('settings','settingsL');
  }catch(e){S.err='ইন্টারনেট সংযোগ নেই বা সার্ভার লোড হয়নি';render()}
})();
