<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>গোপীনাথপুর স্পোর্টস</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07120f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="গোপীনাথপুর">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050d14;--card:rgba(10,26,36,.72);--bd:rgba(80,255,200,.18);--tx:#e8fff6;--mut:#8fb5ad;--a:#2cf5a0;--b:#25c8ff;--gold:#ffd24a;--red:#ff5d73;--in:rgba(255,255,255,.07);--btn:rgba(255,255,255,.06);--ov:rgba(3,10,16,.55);--on:#04211a;color-scheme:dark}
:root[data-theme="light"]{--bg:#e9f5f1;--card:rgba(255,255,255,.84);--bd:rgba(15,120,90,.22);--tx:#10261f;--mut:#4d6b63;--a:#0b9d62;--b:#0a86c4;--gold:#b87d00;--red:#d03a50;--in:rgba(0,0,0,.05);--btn:rgba(255,255,255,.7);--ov:rgba(238,250,246,.72);--on:#fff;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:15px;max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(90px + env(safe-area-inset-bottom,0px))}
#bg{position:fixed;inset:0;z-index:-1;background:var(--bg)}
#bg .bl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease}
#bg .bl.on{opacity:1}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--ov),var(--ov))}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;margin-bottom:12px}
.logo{font-size:clamp(14px,3.7vw,19px);font-weight:700;line-height:1.15;min-width:0;white-space:nowrap}.logo #nm{white-space:nowrap;display:inline-block;max-width:100%;letter-spacing:-.2px}.logo small{white-space:nowrap;font-size:8px;letter-spacing:2px}
#nm{background:linear-gradient(90deg,var(--a),var(--b),var(--gold),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
.logo small{display:block;font-family:Orbitron,sans-serif;font-size:8px;color:var(--a);font-weight:600;letter-spacing:1px;margin-top:2px}
@keyframes flow{to{background-position:300% 0}}
.hb{display:flex;gap:2px;flex-shrink:0;margin-left:auto}
.ic{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:3px 5px;color:var(--tx);font:inherit;font-size:12.5px;line-height:1.3;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.note{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.inst{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(90deg,var(--a),var(--b));color:var(--on);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.inst button{border:0;border-radius:14px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.inst .x{background:transparent;color:var(--on);padding:4px 8px}.inst .y{background:#fff;color:#0a6b3a;font-weight:700}
#sport-filter{display:flex;flex-wrap:nowrap;min-width:0;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--a) rgba(255,255,255,.08);padding:2px 0 7px;touch-action:pan-x;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;cursor:grab}#sport-filter::-webkit-scrollbar{display:block;height:4px}#sport-filter::-webkit-scrollbar-track{background:rgba(255,255,255,.08);border-radius:8px}#sport-filter::-webkit-scrollbar-thumb{background:var(--a);border-radius:8px}#sport-filter .chip{flex:0 0 auto}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#tabs .in{display:flex;width:100%;max-width:720px}
#tabs button{flex:1;border:0;background:transparent;color:var(--mut);font:inherit;font-size:11px;padding:7px 0 8px;cursor:pointer}
#tabs button i{display:block;font-style:normal;font-size:22px;margin:0 auto 1px}
#tabs button.on{color:var(--a);font-weight:700}
#tabs button.on i{filter:drop-shadow(0 0 6px var(--a))}
#fab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 4px rgba(44,245,160,.15),0 8px 24px rgba(0,0,0,.45);animation:glow 2.6s ease-in-out infinite}
#fab em{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:10px;padding:0 6px;min-width:20px;line-height:20px;text-align:center}
@keyframes glow{50%{box-shadow:0 0 0 9px rgba(44,245,160,.08),0 8px 24px rgba(0,0,0,.45)}}
.chips{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;max-width:100%;margin:0 0 10px;padding:2px 0 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;white-space:nowrap;min-height:36px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:20px;font:inherit;font-size:14px;line-height:1.2;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;color:var(--on);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 22px rgba(0,0,0,.18)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:10px;gap:6px}
.lv{background:var(--red);color:#fff;border-radius:10px;padding:1px 10px;font-size:12px;font-weight:700;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,93,115,.7)}70%{box-shadow:0 0 0 9px rgba(255,93,115,0)}100%{box-shadow:0 0 0 0 rgba(255,93,115,0)}}
.dn{color:var(--mut)}.up{color:var(--a)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.vs b{font-size:16px}
.sc{font-family:Orbitron,sans-serif;font-size:22px;font-weight:800;color:var(--a);min-width:96px;background:rgba(0,0,0,.32);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;text-shadow:0 0 12px var(--a);letter-spacing:2px}
:root[data-theme="light"] .sc{background:rgba(0,0,0,.06);text-shadow:none}
.sc.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.25)}100%{transform:scale(1)}}
.mut{color:var(--mut);font-size:13px;text-align:center;margin-top:8px}
.adm{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.mini{border:1px solid var(--bd);background:var(--btn);color:var(--tx);border-radius:10px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.go,.ghost{border:1px solid var(--a);background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);border-radius:12px;padding:10px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.ghost{background:var(--card);color:var(--a)}
.red{color:var(--red)!important}
.bar2{display:flex;gap:8px;margin-bottom:10px}.bar2 button{flex:1}
.form{display:grid;gap:8px}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:400;font-size:12px}td:nth-child(2),th:nth-child(2){text-align:left}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mut);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.sum b{display:block;font-size:18px;margin-top:2px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row small{display:block;color:var(--mut);font-size:12px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 8px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pa{width:76px;height:76px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);font-size:30px;font-weight:700;box-shadow:0 0 14px rgba(44,245,160,.35)}
.pc b{display:block}.pc small{display:block;color:var(--mut);font-size:12px}
.pn{display:inline-block;background:var(--gold);color:#241a00;border-radius:10px;padding:0 8px;font-size:12px;font-weight:700;margin-top:3px}
.empty{text-align:center;color:var(--mut);padding:24px 0}.err{color:var(--red);font-size:13px;margin:6px 0}
.mut2{color:var(--mut);font-size:13px;margin:8px 0}
.ov{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:720px;max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sh label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.sh .ph{display:flex;gap:10px;align-items:center}.sh .ph img,.sh .ph .pa{width:64px;height:64px;margin:0;flex-shrink:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:#14213d;color:#fff;padding:10px 16px;border-radius:14px;z-index:60;font-size:14px;max-width:92%;display:none;box-shadow:0 6px 20px #0006}
/* ---- চ্যাট ---- */
.chat{position:fixed;top:0;left:0;right:0;height:100dvh;z-index:40;max-width:720px;margin:0 auto;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,rgba(44,245,160,.10),transparent),var(--bg);border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
.ch{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;border-bottom:1px solid var(--bd);background:var(--card)}
.ch .ct{flex:1;min-width:0}.ch .ct b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch small{color:var(--mut);font-size:12px}
.cm{flex:1;overflow-y:auto;padding:10px 12px}
.dy{text-align:center;color:var(--mut);font-size:12px;margin:12px 0 8px}
.m{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}.m.me{flex-direction:row-reverse}
.av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);font-weight:700}
.mb{max-width:78%;min-width:0;background:var(--in);border:1px solid var(--bd);border-radius:16px 16px 16px 4px;padding:7px 11px;word-wrap:break-word;overflow-wrap:anywhere}
.m.me .mb{background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);border-color:transparent;border-radius:16px 16px 4px 16px}
.mb .nm{display:block;color:var(--a);font-size:12px;font-weight:600;cursor:pointer}.m.me .nm{display:none}
.mb .tm{display:block;font-size:10px;opacity:.65;margin-top:2px;text-align:right}
.mi{max-width:100%;border-radius:10px;margin-top:4px;display:block}
.rq{border-left:3px solid var(--gold);background:rgba(0,0,0,.2);border-radius:6px;padding:3px 8px;margin-bottom:4px;font-size:12px}
.rq b{display:block}
.mn{color:var(--gold);font-weight:700}.m.me .mn{color:#5a2e00}
.rxr{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.rx{border:1px solid var(--bd);background:var(--btn);color:var(--tx);border-radius:12px;padding:1px 7px;font:inherit;font-size:12px;cursor:pointer}
.rx.on{border-color:var(--a);background:rgba(44,245,160,.2)}
.cq{display:flex;gap:6px;overflow-x:auto;padding:6px 10px}.cq .chip{padding:5px 11px;font-size:13px}
.rp{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 10px;padding:6px 10px;border-left:3px solid var(--gold);background:var(--in);border-radius:8px;font-size:13px}
.cf{display:flex;gap:6px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--card)}
.cf input{flex:1}
.ma{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:0 0 24px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--a),var(--b));color:var(--on);font-size:12px;font-weight:700}
.evb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd);font-size:13px}
.evb>div:last-child{text-align:right}.evb>div:last-child .pe{flex-direction:row-reverse}
.pe{display:flex;align-items:center;gap:6px;margin-bottom:5px}.pe small{color:var(--mut);font-size:10px}
.eg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.eg .mini{padding:10px 6px;font-size:14px}
.wrap{flex-wrap:wrap;overflow:visible}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gg figure{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}.gg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}.gg figcaption{padding:6px 8px;font-size:12px;color:var(--mut)}
.ft{text-align:center;color:var(--mut);font-size:12px;margin-top:18px;line-height:1.9}.ft button{color:var(--a);background:none;border:0;font:inherit;cursor:pointer}
.st td:nth-child(2),.st th:nth-child(2){text-align:center}.st{font-size:13px}
.ab a.go,.ab a.ghost{display:block;text-align:center;text-decoration:none;margin-top:8px}
.qr{background:#fff;border-radius:12px;padding:6px;width:120px;height:120px;flex:0 0 120px}.qr svg{width:100%;height:100%;display:block}
.logo .sub{display:flex;align-items:center;gap:6px}
.sub .mini{padding:0 8px;font-size:12px;line-height:20px;border-radius:9px}
.qp{margin-top:10px;padding-top:8px;border-top:1px dashed var(--bd)}.qp .cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qp h6{font:inherit;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.pw{display:flex;flex-wrap:wrap;gap:5px}.pw .mini{padding:5px 9px}
@media print{body{max-width:none;background:#fff;color:#111;padding:0}header,#tabs,#fab,#form,#banner,#notes,.chips,.adm,button{display:none!important}.card{break-inside:avoid;border:1px solid #bbb;background:#fff;color:#111;box-shadow:none}#list{display:block}}
#lgb{font-weight:700;font-size:12px;letter-spacing:.4px;min-width:34px}
header{flex-wrap:nowrap;gap:6px}header>div:first-child{flex:1 1 auto;min-width:0}.logo{white-space:normal!important;font-size:clamp(12px,3.3vw,17px)}.logo #nm{white-space:normal!important}.logo small{white-space:nowrap}.hb{gap:2px}.hb .ic{padding:3px 4px;font-size:12px}#lgb{min-width:30px;font-size:11px}

/* ---- চ্যাট ২.০ ---- */
.chat{background:radial-gradient(90% 40% at 85% 0%,rgba(44,245,160,.14),transparent),radial-gradient(80% 40% at 0% 100%,rgba(34,200,255,.10),transparent),var(--bg)}
.ch{background:rgba(10,24,32,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--bd),0 8px 24px #0004}
.ch .ct b{font-size:16px}.ch .ct b::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 8px var(--a);margin-right:7px;vertical-align:middle}
.cm{padding:12px 12px 6px;scroll-behavior:smooth}
.dy{display:table;margin:14px auto 10px;padding:3px 12px;border-radius:12px;background:var(--btn);border:1px solid var(--bd)}
.m{margin-bottom:10px;align-items:flex-start}.m.cont{margin-top:-7px}.m.cont .av{visibility:hidden}.m.cont .nm{display:none}
.mb{border-radius:6px 18px 18px 18px;box-shadow:0 2px 10px #0003;cursor:pointer}.m.cont .mb{border-radius:18px}
.m.me .mb{border-radius:18px 6px 18px 18px;box-shadow:0 4px 16px rgba(44,245,160,.22)}.m.me.cont .mb{border-radius:18px}
.mi{width:min(270px,66vw);max-height:360px;object-fit:cover;border-radius:14px;cursor:zoom-in;margin-top:4px;background:var(--in)}
.rxr{gap:5px;margin-top:6px}.rx{border-radius:14px;padding:2px 8px}
.rxr.pk{padding-top:6px;border-top:1px dashed rgba(255,255,255,.15)}
.cf{margin:4px 10px calc(8px + env(safe-area-inset-bottom,0px));padding:6px;border:1px solid var(--bd);border-radius:24px;background:rgba(10,24,32,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.cf input{border:0;background:var(--in);border-radius:20px;padding:10px 14px}
.cf .go{border-radius:50%;width:42px;height:42px;padding:0;flex:none}.cf .ic{border-radius:50%;width:42px;height:42px;padding:0;flex:none}
.rp img{height:56px;border-radius:8px}
.cv{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94);display:flex;flex-direction:column}
.cvb{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff}
.cvs{flex:1;overflow:auto;display:flex;-webkit-overflow-scrolling:touch}
.cvs img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;cursor:zoom-in}.cvs img.z{max-width:none;max-height:none;width:240%;cursor:zoom-out}
.cvh{text-align:center;color:#9bb;font-size:12px;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px))}

/* ---- খবরের মতো চলমান ঘোষণা ---- */
.tk{display:flex;align-items:stretch;margin-bottom:8px;border:1px solid var(--bd);border-left:4px solid var(--gold);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer}
.tkl{flex:none;display:flex;align-items:center;padding:0 10px;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--gold),#ff9a3c);color:#2b1700;white-space:nowrap}
.tkv{flex:1;min-width:0;overflow:hidden;padding:9px 0}
.tkt{display:flex;width:max-content;animation:tkm 30s linear infinite;will-change:transform}
.tkt span{white-space:pre;font-size:14px;padding-right:0}
.tk.ps .tkt{animation-play-state:paused}
@keyframes tkm{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tkt{animation:none}.tkv{overflow-x:auto}}

function fsDb(fs,F){
  const mkq=(c,mods=[])=>({orderBy:(f,d)=>mkq(c,[...mods,F.orderBy(f,d)]),limit:n=>mkq(c,[...mods,F.limit(n)]),
    onSnapshot:(ok,err)=>F.onSnapshot(F.query(F.collection(fs,c),...mods),ok,e=>err&&err({code:e.code})),
    add:o=>F.addDoc(F.collection(fs,c),o),
    doc:id=>({update:o=>F.updateDoc(F.doc(fs,c,id),o),delete:()=>F.deleteDoc(F.doc(fs,c,id)),set:o=>F.setDoc(F.doc(fs,c,id),o,{merge:true}),
      get:async()=>{const s=await F.getDoc(F.doc(fs,c,id));return s.exists()?s.data():null},
      react:(k,uid,on)=>F.updateDoc(F.doc(fs,c,id),{['reacts.'+k]:on?F.arrayUnion(uid):F.arrayRemove(uid)})})});
  return{collection:c=>mkq(c),doc:p=>{const[c,id]=p.split('/');return mkq(c).doc(id)}};
}

let tt;

function push(t,b,quiet){t=gsT(t);if(b!=null)b=gsT(b);
  if(Date.now()-S.mute<1500)return;
  if(!quiet)toast(t,b);
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'&&ls.get('gs_nf')==='on'){ 
    const o={body:b,icon:'icon-192.png',badge:'icon-192.png'};
    (navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>r?r.showNotification(t,o):new Notification(t,o)).catch(()=>{});
  }
}
function diff(key,list){
  const first=!S.seen[key];S.seen[key]=1;if(first)return;const old=S[key];
  if(key==='matches')list.forEach(m=>{const o=old.find(x=>x.id===m.id),sc=m.home+' '+bn(m.hs||0)+'–'+bn(m.as||0)+' '+m.away;
    if(!o)push('🆕 নতুন ম্যাচ',m.home+' বনাম '+m.away+(m.when?' — '+m.when:''));
    else if(o.status!==m.status&&m.status==='live')push('🔴 ম্যাচ শুরু',sc);
    else if(o.status!==m.status&&m.status==='done')push('🏁 ম্যাচ শেষ',sc);
    else if((o.hs!==m.hs||o.as!==m.as)&&m.status!=='upcoming'){S.bump[m.id]=Date.now();push('⚽ স্কোর আপডেট',sc)}});
  if(key==='notices')list.forEach(n=>{if(!old.find(x=>x.id===n.id))push('📢 নতুন ঘোষণা',n.text)});
  if(key==='chat')list.forEach(c=>{if(!old.find(x=>x.id===c.id)&&c.uid!==S.me.id){
    if(S.cs.open&&S.cs.room===(c.room||'all'))return;
    push('💬 '+(c.name||'সদস্য'),c.text||'📷 ছবি',S.cs.open)}});
}
async function toggleNotif(){
  if(!('Notification' in window)){toast('এই ব্রাউজারে নোটিফিকেশন সুবিধা নেই','iPhone-এ আগে অ্যাপটি Home Screen-এ ইনস্টল করুন');return}
  if(Notification.permission==='granted'){const off=ls.get('gs_nf')!=='off';ls.set('gs_nf',off?'off':'on');toast(off?'🔕 নোটিফিকেশন বন্ধ':'🔔 নোটিফিকেশন চালু');render();if(!off)enablePush();return}
  if(Notification.permission==='denied'){toast('ব্রাউজারের সেটিংস থেকে নোটিফিকেশন "Allow" করুন');return}
  const p=await Notification.requestPermission();ls.set('gs_nf','on');toast(p==='granted'?'🔔 নোটিফিকেশন চালু হয়েছে':'অনুমতি দেওয়া হয়নি');render();if(p==='granted')enablePush();
}

async function toggleRec(){

    if(!mt){st.getTracks().forEach(t=>t.stop());toast('এই ফোনে ভয়েস রেকর্ড সাপোর্ট নেই');return}
    const r=new MediaRecorder(st,{mimeType:mt,audioBitsPerSecond:24000}),ch=[],t0=Date.now();let tk,tm;rec=r;
    r.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};

      if(Date.now()-t0<800)return;const fr=new FileReader();fr.onload=()=>{if(fr.result.length>290000){toast('ভয়েস অনেক বড়');return}sendChat('🎤 ভয়েস মেসেজ','','',{aud:fr.result})};fr.readAsDataURL(new Blob(ch,{type:mt}))};

  }catch(e){toast('মাইক্রোফোনের অনুমতি দিন')}

function readImg(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
