function fsDb(fs,F){
  const mkq=(c,mods=[])=>({orderBy:(f,d)=>mkq(c,[...mods,F.orderBy(f,d)]),limit:n=>mkq(c,[...mods,F.limit(n)]),
    onSnapshot:(ok,err)=>F.onSnapshot(F.query(F.collection(fs,c),...mods),ok,e=>err&&err({code:e.code})),
    add:o=>F.addDoc(F.collection(fs,c),o),
    doc:id=>({update:o=>F.updateDoc(F.doc(fs,c,id),o),delete:()=>F.deleteDoc(F.doc(fs,c,id)),set:o=>F.setDoc(F.doc(fs,c,id),o,{merge:true}),
      get:async()=>{const s=await F.getDoc(F.doc(fs,c,id));return s.exists()?s.data():null},
      react:(k,uid,on)=>F.updateDoc(F.doc(fs,c,id),{['reacts.'+k]:on?F.arrayUnion(uid):F.arrayRemove(uid)})})});
  return{collection:c=>mkq(c),doc:p=>{const[c,id]=p.split('/');return mkq(c).doc(id)}};
}

function push(t,b,quiet){
  if(Date.now()-S.mute<1500)return;
  if(!quiet)toast(t,b);
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'&&ls.get('gs_nf')==='on'){ 
    const o={body:b,icon:'icon-192.png',badge:'icon-192.png'};
    (navigator.serviceWorker?navigator.serviceWorker.getRegistration():Promise.resolve(null)).then(r=>r?r.showNotification(t,o):new Notification(t,o)).catch(()=>{});
  }
}
function diff(key,list){
  const first=!S.seen[key];S.seen[key]=1;if(first)return;const old=S[key];
  if(key==='matches')list.forEach(m=>{const o=old.find(x=>x.id===m.id),sc=m.home+' '+bn(m.hs||0)+'–'+bn(m.as||0)+' '+m.away;
    if(!o)push('🆕 নতুন ম্যাচ',m.home+' বনাম '+m.away+(m.when?' — '+m.when:''));
    else if(o.status!==m.status&&m.status==='live')push('🔴 ম্যাচ শুরু',sc);
    else if(o.status!==m.status&&m.status==='done')push('🏁 ম্যাচ শেষ',sc);
    else if((o.hs!==m.hs||o.as!==m.as)&&m.status!=='upcoming'){S.bump[m.id]=Date.now();push('⚽ স্কোর আপডেট',sc)}});
  if(key==='notices')list.forEach(n=>{if(!old.find(x=>x.id===n.id))push('📢 নতুন ঘোষণা',n.text)});
  if(key==='chat')list.forEach(c=>{if(!old.find(x=>x.id===c.id)&&c.uid!==S.me.id){
    if(S.cs.open&&S.cs.room===(c.room||'all'))return;
    push('💬 '+(c.name||'সদস্য'),c.text||'📷 ছবি',S.cs.open)}});
}

  if(Notification.permission==='granted'){const off=ls.get('gs_nf')!=='off';ls.set('gs_nf',off?'off':'on');toast(off?'🔕 নোটিফিকেশন বন্ধ':'🔔 নোটিফিকেশন চালু');render();return}

  const p=await Notification.requestPermission();ls.set('gs_nf','on');toast(p==='granted'?'🔔 নোটিফিকেশন চালু হয়েছে':'অনুমতি দেওয়া হয়নি');render();
}

  <label>${m.sport==='cricket'||m.sport==='shortpitch'?'কে ব্যাট করছে? (রান তার প্রোফাইলে যোগ হবে; উইকেট/ক্যাচের সময় বোলার/ফিল্ডারের টিম বেছে নিন)':'কোন প্লেয়ার?'} (${esc(tn)})</label><div class="chips wrap">${ro.map(p=>`<button class="chip ${sh.pid===p.id?'on':''}" data-a="evp" data-id="${p.id}">${p.num!==''&&p.num!=null?'#'+bn(p.num)+' ':''}${esc(p.name)}</button>`).join('')||'<span class="mut2">এই টিমের প্লেয়ার যোগ নেই — নিচে নাম লিখুন</span>'}</div>
  <input id="ev-n" placeholder="অথবা নাম লিখুন" value="${esc(sh.name||'')}" style="margin-top:8px"><input id="ev-m" type="number" inputmode="numeric" placeholder="মিনিট (ঐচ্ছিক)" value="${esc(sh.min||'')}" style="margin-top:6px">
  <label>কী হলো? ট্যাপ করলেই যোগ হবে</label><div class="eg">${R.map(r=>`<button class="mini" data-a="evk" data-v="${r[0]}">${r[1]} ${r[2]}${r[3]?' ('+(r[3]>0?'+':'−')+bn(Math.abs(r[3]))+')':''}</button>`).join('')}</div>
  <label>এ পর্যন্ত ঘটনা</label><div id="evl"></div><button class="ghost" data-a="shclose" style="width:100%;margin-top:10px">বন্ধ করুন</button></div></div>`;evLog();
}
function evLog(){const el=$('#evl');if(!el||!S.sheet||S.sheet.kind!=='ev')return;const m=S.matches.find(x=>x.id===S.sheet.mid);if(!m)return;
  const E=[...(m.events||[])].reverse();
  el.innerHTML=E.length?E.map(e=>{const d=evDef(m.sport,e.k);return `<div class="row"><div>${d[1]} <b>${esc(e.name)}</b> <small style="display:inline">${esc(d[2])}${e.min?' · '+bn(e.min)+"'":''} · ${esc(e.team==='home'?m.home:m.away)}</small></div><button class="mini red" data-a="evdel" data-id="${e.id}">✕</button></div>`}).join(''):'<div class="mut2">এখনো কিছু নেই</div>'}
const evKeep=()=>{const n=$('#ev-n'),mi=$('#ev-m');if(n)S.sheet.name=n.value;if(mi)S.sheet.min=mi.value};
function addEv(k){
  evKeep();const sh=S.sheet,m=S.matches.find(x=>x.id===sh.mid);if(!m||!S.admin)return;
  const df=evDef(m.sport,k),tn=sh.team==='home'?m.home:m.away,p=S.players.find(x=>x.id===sh.pid),typed=(sh.name||'').trim(),name=typed||(p&&p.name)||tn;
  const ev={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),k,team:sh.team,pid:typed?'':(sh.pid||''),name,min:sh.min===''||sh.min==null?'':+sh.min,ts:Date.now()};
  const fr=df[4]==='own'?(sh.team==='home'?'away':'home'):sh.team,up={events:[...(m.events||[]).filter(e=>!(k==='mom'&&e.k==='mom')),ev],hs:m.hs||0,as:m.as||0};
  if(df[3]){const fl=fr==='home'?'hs':'as';up[fl]=Math.max(0,up[fl]+df[3])}
  if(m.status==='upcoming')up.status='live';
  toast(df[1]+' '+name,df[2]);write(()=>S.db.doc('matches/'+m.id).update(up));
}
function delEv(id){const m=S.sheet&&S.matches.find(x=>x.id===S.sheet.mid),e=m&&(m.events||[]).find(x=>x.id===id);if(!e)return;
  const df=evDef(m.sport,e.k),fr=df[4]==='own'?(e.team==='home'?'away':'home'):e.team,up={events:m.events.filter(x=>x.id!==id),hs:m.hs||0,as:m.as||0};
  if(df[3]){const fl=fr==='home'?'hs':'as';up[fl]=Math.max(0,up[fl]-df[3])}
  write(()=>S.db.doc('matches/'+m.id).update(up))}
function shareMatch(m){
  const ic=(SP[m.sport]||['🎮'])[0],st={live:'🔴 লাইভ',done:'🏁 শেষ',upcoming:'⏳ আসন্ন'}[m.status]||'',sc=m.status==='upcoming'?'বনাম':bn(m.hs||0)+' – '+bn(m.as||0);
  const gl=(m.events||[]).filter(e=>evDef(m.sport,e.k)[3]>0).map(e=>evDef(m.sport,e.k)[1]+' '+e.name+(e.min?' '+bn(e.min)+"'":'')).join('\n');
  const t=`${ic} ${m.home} ${sc} ${m.away}\n${st}${m.when?' · '+m.when:''}${gl?'\n'+gl:''}\n\n${cfg().name||'গোপীনাথপুর স্পোর্টস'}: ${location.origin+location.pathname}`;
  if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}

/* ---------- ক্লিক ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v,m=S.matches.find(x=>x.id===id);
  if(a==='shx'&&e.target!==b)return;
  if(a==='theme'){const r=document.documentElement,n=r.dataset.theme==='light'?'dark':'light';r.dataset.theme=n;ls.set('gs_th',n)}
  else if(a==='tab'){S.tab=v;S.err='';formHtml();render();scrollTo(0,0)}
  else if(a==='sp'){S.sport=v;render()}
  else if(a==='install'){if(S.dip){S.dip.prompt();S.dip=null}else{S.sheet={help:true};sheet()}}
  else if(a==='ibx'){ls.set('gs_ib','x');render()}
  else if(a==='notif')toggleNotif();
  else if(a==='login'){if(S.user){S.sheet={kind:'acct'};sheet()}else openLogin()}
  else if(a==='dogoogle'){
    if(S.sheet)S.sheet.err='';
    S.google().catch(x=>{
      const c=x&&x.code;
      if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){S.googleRedirect().catch(()=>{});return}
      if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
      if(S.sheet){S.sheet.err=c==='auth/unauthorized-domain'?'Firebase-এ Authorized domains-এ এই সাইটের ঠিকানা যোগ করুন':c==='auth/operation-not-allowed'?'Firebase-এ Google সাইন ইন চালু করুন':'Google লগইন হয়নি, আবার চেষ্টা করুন';sheet()}
    });
  }
  else if(a==='dosignout'){S.sheet=null;sheet();S.signOut()}
  else if(a==='cname'){S.sheet={kind:'name',d:{name:S.me.name||(S.user&&S.user.displayName)||''}};if(!S.user){openLogin();return}sheet()}
  else if(a==='savename'){const n=$('#sh-nm').value.trim();if(!n){S.sheet.err='নাম লিখুন';sheet();return}
    S.me.name=n;S.sheet=null;sheet();write(()=>S.db.doc('users/'+S.me.id).set({name:n}));chatFoot()}
  else if(a==='admins'&&S.owner){S.sheet={kind:'admins',err:''};sheet()}
  else if(a==='approve'&&S.admin){const r=(S.requests||[]).find(x=>x.id===id);if(r){write(async()=>{await S.db.doc('users/'+id).set({approved:true,email:r.email||'',name:r.name||'',approvedAt:Date.now(),approvedBy:S.me.name||S.me.id});await S.db.doc('requests/'+id).set({status:'approved',approvedAt:Date.now()})})}}
  else if(a==='reject'&&S.admin){write(async()=>{await S.db.doc('requests/'+id).set({status:'rejected',rejectedAt:Date.now()})})}
  else if(a==='addadmin'){const em=$('#ad-e').value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){S.sheet.err='সঠিক ইমেইল দিন';sheet();return}
    S.sheet.err='';write(()=>S.db.doc('admins/'+em).set({email:em,by:S.me.name||'',ts:Date.now()}));const x=$('#ad-e');if(x)x.value=''}
  else if(a==='new')openSheet(b.dataset.c);
  else if(a==='edit')openSheet(b.dataset.c,id);
  else if(a==='esite')openSheet('settings','site');
  else if(a==='shclose'||a==='shx'){S.sheet=null;sheet()}
  else if(a==='shsave')saveSheet();
  else if(a==='rmphoto'){S.sheet.photo='';sheet()}
  else if(a==='g'&&m){const f=b.dataset.s,nv=Math.max(0,(m[f]||0)+(+b.dataset.d));write(()=>S.db.doc('matches/'+id).update({[f]:nv,hs:f==='hs'?nv:(m.hs||0),as:f==='as'?nv:(m.as||0),status:m.status==='upcoming'?'live':m.status}))}
  else if(a==='st'&&m)write(()=>S.db.doc('matches/'+id).update({status:v,hs:m.hs||0,as:m.as||0,...(v==='live'?{startedAt:m.startedAt||Date.now()}:{})}));
  else if(a==='del'){const c=b.dataset.c,k=c+id;if(S.del===k){S.del=null;write(()=>S.db.doc(c+'/'+id).delete())}else{S.del=k;render()}}
  else if(a==='about'){S.sheet={kind:'about'};sheet()}
  else if(a==='edabout'&&S.owner){S.sheet={kind:'devedit',err:''};sheet()}
  else if(a==='savedev'&&S.owner){const d={name:$('#dev-name').value.trim(),photo:$('#dev-photo').value.trim(),phone:$('#dev-phone').value.trim(),email:$('#dev-email').value.trim(),facebook:$('#dev-facebook').value.trim()};const about={wag:$('#dev-wag').value.trim(),wan:$('#dev-wan').value.trim(),intro:$('#dev-intro').value.trim(),rules:$('#dev-rules').value.trim()};S.sheet=null;sheet();write(async()=>{await S.db.doc('settings/developer').set(d);await S.db.doc('settings/about').set(about)});}
  else if(a==='cpy'){const u=location.origin+location.pathname;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('🔗 লিংক কপি হয়েছে')).catch(()=>toast(u))}
  else if(a==='share'&&m)shareMatch(m);
  else if(a==='ev'&&S.admin&&m){S.sheet={kind:'ev',mid:id,team:'home',pid:'',name:'',min:''};sheet()}
  else if(a==='evt'){evKeep();S.sheet.team=v;S.sheet.pid='';sheet()}
  else if(a==='evp'){evKeep();S.sheet.pid=S.sheet.pid===id?'':id;S.sheet.name='';sheet()}
  else if(a==='evk')addEv(v);
  else if(a==='evdel')delEv(id);
  else if(a==='prof'){S.sheet={kind:'prof',pid:id};sheet()}
  else if(a==='zoom'){const g=S.gallery.find(x=>x.id===id);if(g){S.sheet={kind:'zoom',src:g.photo};sheet()}}
  else if(a==='fundtog'&&S.admin)write(()=>S.db.doc('settings/fund').set({show:cfgOf('fund').show!==true}));
  /* চ্যাট */
  else if(a==='chat')openChat('all');
  else if(a==='mchat')openChat(id);
  else if(a==='croom'){S.cs.room='all';S.cs.stick=true;render()}
  else if(a==='cclose'){S.cs.open=false;S.cs.reply=null;const c=$('#chat');if(c)c.remove();render()}
  else if(a==='cimg'){if(needName())return;const f=$('#cfile');if(f)f.click()}
  else if(a==='rmreply'){S.cs.reply=null;crep()}
  else if(a==='rmimg'){S.cs.img='';crep()}
  else if(a==='mention'){const i=$('#ci');if(i&&b.dataset.n){i.value+='@'+b.dataset.n.replace(/\s+/g,'_')+' ';i.focus()}}
  else if(a==='reply'){if(needName())return;const x=S.chat.find(y=>y.id===id);if(!x)return;S.cs.reply={id,name:x.name||'সদস্য',text:(x.text||'📷 ছবি').slice(0,60)};crep();const i=$('#ci');if(i)i.focus()}
  else if(a==='react'){if(!S.user||!S.approved){if(S.user){S.sheet={kind:'pending'};sheet()}else openLogin();return}const x=S.chat.find(y=>y.id===id),k=b.dataset.k;if(!x)return;
    const on=!((x.reacts&&x.reacts[k])||[]).includes(S.me.id);write(()=>S.db.doc('chat/'+id).react(k,S.me.id,on))}
  else if(a==='csend'||a==='quick'){
    if(needName())return;
    const inp=$('#ci'),t=a==='quick'?v:(inp?inp.value.trim():'');
    if(!t&&!(a==='csend'&&S.cs.img))return;
    sendChat(t,a==='csend'?S.cs.img:'');if(a==='csend'&&inp)inp.value='';
  }
});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.dip=e;render()});

/* ---------- শুরু ---------- */
(async()=>{
  document.documentElement.dataset.theme=ls.get('gs_th')||'dark';
  if(!ls.get('gs_cs'))ls.set('gs_cs',Date.now());
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
  formHtml();render();
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
    S.db=fsDb(F.getFirestore(app),F);
    S.google=()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider());
    S.googleRedirect=()=>Au.signInWithRedirect(auth,new Au.GoogleAuthProvider());
    S.signOut=()=>Au.signOut(auth);
    let unA=null;
    Au.onAuthStateChanged(auth,async u=>{
      if(u&&u.isAnonymous){await Au.signOut(auth);return}
      S.user=u;S.me.id=u?u.uid:null;S.me.photo=(u&&u.photoURL)||'';S.me.name='';
      const em=u&&u.email?u.email.toLowerCase():'';
      S.owner=!!(em&&u.emailVerified&&OWNER.includes(em));S.admin=S.owner;
      if(S.sheet&&S.sheet.kind==='login')S.sheet=null;
      if(unA){unA();unA=null;S.admins=[]}S.requests=[];S.approved=false;
      formHtml();render();sheet();chatFoot();
      if(!u)return;
      try{
        const p=await S.db.doc('users/'+u.uid).get();S.me.name=(p&&p.name)||'';
        if(!S.admin&&em){const ad=await S.db.doc('admins/'+em).get();S.admin=!!ad}
        S.approved=!!(S.owner||S.admin||(p&&p.approved===true));
        if(S.admin)sub('requests','requests');
        if(!S.approved){await S.db.doc('requests/'+u.uid).set({uid:u.uid,email:em,name:S.me.name||(u.displayName||''),photo:u.photoURL||'',status:'pending',ts:Date.now()});S.sheet={kind:'pending'};}
        if(S.owner)unA=sub('admins','admins');
      }catch(x){S.approved=!!(S.owner||S.admin)}
      if(S.approved&&!S.me.name&&!S.sheet){S.sheet={kind:'name',d:{name:u.displayName||''}};}
      formHtml();render();sheet();chatFoot();
    });
    sub('matches','matches',S.db.collection('matches').orderBy('ts','asc').limit(300));
    S.subLedger=()=>sub('ledger','ledger',S.db.collection('ledger').orderBy('ts','asc').limit(500));render();
    sub('gallery','gallery',S.db.collection('gallery').orderBy('ts','desc').limit(60));
    sub('notices','notices',S.db.collection('notices').orderBy('ts','desc').limit(5));
    sub('chat','chat',S.db.collection('chat').orderBy('ts','desc').limit(150));
    sub('players','players',S.db.collection('players').orderBy('ts','asc').limit(200));
    sub('settings','settingsL');
  }catch(e){S.err='ইন্টারনেট সংযোগ নেই বা সার্ভার লোড হয়নি';render()}
})();
</script></body></html>
