function fsDb(fs,F){
  const mkq=(c,mods=[])=>({orderBy:(f,d)=>mkq(c,[...mods,F.orderBy(f,d)]),limit:n=>mkq(c,[...mods,F.limit(n)]),
    onSnapshot:(ok,err)=>F.onSnapshot(F.query(F.collection(fs,c),...mods),ok,e=>err&&err({code:e.code})),
    add:o=>F.addDoc(F.collection(fs,c),o),
    doc:id=>({update:o=>F.updateDoc(F.doc(fs,c,id),o),delete:()=>F.deleteDoc(F.doc(fs,c,id)),set:o=>F.setDoc(F.doc(fs,c,id),o,{merge:true}),
      get:async()=>{const s=await F.getDoc(F.doc(fs,c,id));return s.exists()?s.data():null},
      react:(k,uid,on)=>F.updateDoc(F.doc(fs,c,id),{['reacts.'+k]:on?F.arrayUnion(uid):F.arrayRemove(uid)})})});
  return{collection:c=>mkq(c),doc:p=>{const[c,id]=p.split('/');return mkq(c).doc(id)}};
}

const BGC={all:['#07323a','#050d14'],football:['#0b4a2a','#04150c'],cricket:['#3a3a10','#12140a'],shortpitch:['#3a3a10','#12140a'],badminton:['#0c3550','#04121c'],volleyball:['#4a2c0c','#1a0d03'],kabaddi:['#4a1a1a','#180707'],carrom:['#3d2a10','#140c04'],chess:['#22223d','#0a0a18']};
function bgSvg(k){
  const [c1,c2]=BGC[k]||BGC.all,L='stroke="#8dffd8" stroke-opacity=".3" stroke-width="3" fill="none"';let s='';
  const R=(x,y,w,h,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${L} ${e}/>`,Ln=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" ${L}/>`,C=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" ${L}/>`;
  if(k==='football')s=R(40,130,320,540)+Ln(40,400,360,400)+C(200,400,52)+R(115,130,170,80)+R(115,590,170,80)+R(160,130,80,34)+R(160,636,80,34);
  else s=C(200,560,60)+C(200,560,120)+Ln(0,560,400,560);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="400" height="800" fill="url(#g)"/>${s}</svg>`;
}
let bgI=0,bgK='';
function setBg(k){
  if(k===bgK)return;bgK=k;
  const L=document.querySelectorAll('#bg .bl'),n=L[bgI^1],o=L[bgI];
  n.style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(bgSvg(k))+'")';
  n.classList.add('on');o.classList.remove('on');bgI^=1;
}

function renderGoalFeed(m){
  const events = m.events || [];
  if(!events.length) return '';
  const goals = events.filter(e=>['goal','pen','og','yellow','red'].includes(e.k));
  if(!goals.length) return '';
  return `<div class="goal-feed">` + goals.map(g=>{
    const typeLabel = g.k==='goal'?'⚽ গোল!':g.k==='pen'?'🎯 পেনাল্টি গোল!':g.k==='og'?'🙈 আত্মঘাতী গোল':g.k==='yellow'?'🟨 হলুদ কার্ড':'🟥 লাল কার্ড';
    return `<div class="goal-feed-item"><span>${typeLabel}</span> <b>${esc(g.name)}</b> <span>(${bn(g.min||0)} মি.)</span> - <i>${esc(g.team==='home'?m.home:m.away)}</i></div>`;
  }).join('') + `</div>`;
}

  if(!S.user){openLogin();return}
  S.cs.open=true;S.cs.room=room||'all';
  let el=$('#chat');if(!el){el=document.createElement('div');el.id='chat';el.className='chat';document.body.appendChild(el)}
  el.innerHTML=`<div class="ch"><button class="ic" data-a="cclose">←</button><div class="ct"><b>💬 গ্রুপ চ্যাট</b></div></div><div id="cmsgs" class="cm"></div><div id="cin"></div>`;
  
  if(S.approved){
    $('#cin').innerHTML = `<div class="cf"><input id="ci" placeholder="মেসেজ লিখুন..." maxlength="300"><button class="go" data-a="csend">➤</button></div>`;
  } else {
    $('#cin').innerHTML = `<div class="cf" style="justify-content:center;color:var(--gold)">অ্যাডমিন অনুমোদনের অপেক্ষায় আছেন...</div>`;
  }
  render();
}

function sendChat(text){
  if(!S.approved) return;
  const o={text,name:S.me.name||S.user.displayName||'সদস্য',uid:S.me.id,ts:Date.now()};
  write(()=>S.db.collection('chat').add(o));
}

function openSheet(col,id){
  const F=FORMS[col],d={...(id?(S[col].find(x=>x.id===id)||{}):{})};
  S.sheet={col,id,d,err:''};sheet();
}

function openLogin(){S.sheet={kind:'login',err:''};sheet()}

// এডমিন ইউজার ও সাইন ইন এপ্রুভ ম্যানেজমেন্ট
function adList(){
  const el=$('#adl');if(!el)return;
  const users = S.users;
  el.innerHTML=users.length?users.map(u=>`<div class="row">
    <div>
      <b>${esc(u.name||u.email)}</b>
      <small>${esc(u.email)}</small>
      <span class="user-approval-tag ${u.approved?'status-approved':'status-pending'}">${u.approved?'অনুমোদিত':'অপেক্ষমাণ'}</span>
    </div>
    <div>
      ${!u.approved?`<button class="mini" data-a="appr" data-uid="${u.id}">✓ একসেপ্ট</button>`:''}
      <button class="mini red" data-a="remu" data-uid="${u.id}">রিমুভ</button>
    </div>
  </div>`).join(''):'<div class="empty">কোনো সাইন ইন ইউজার নেই</div>';
}

function sheet(){
  const sh=S.sheet,el=$('#sheet');
  if(!sh){el.innerHTML='';return}
  const err=sh.err?`<div class="err">${esc(sh.err)}</div>`:'';

  if(sh.kind==='login'){
    el.innerHTML=`<div class="ov" data-a="shx"><div class="sh">
      <b style="font-size:17px">🔐 সাইন ইন</b>
      <p class="mut2">গোপীনাথপুর স্পোর্টস অ্যাপে সাইন ইন করুন। অ্যাডমিন অনুমোদন করার পরই আপনি মূল মেসেজ ও ফিচার দেখতে পারবেন।</p>${err}
      <button class="go" data-a="dogoogle" style="width:100%">G&nbsp; Google দিয়ে সাইন ইন</button>
      <button class="ghost" data-a="shclose" style="width:100%;margin-top:8px">বাতিল</button>
    </div></div>`;
    return;
  }

  if(sh.kind==='acct'){
    el.innerHTML=`<div class="ov" data-a="shx"><div class="sh">
      <b style="font-size:17px">👤 ${esc(S.me.name||S.user.displayName||'আমার প্রোফাইল')}</b>
      <p class="mut2">${esc(S.user.email)}<br>অবস্থা: <b>${S.approved?'অনুমোদিত (Active)':'অপেক্ষমাণ (Pending Admin Approval)'}</b></p>
      <button class="ghost red" data-a="dosignout" style="width:100%">সাইন আউট</button>
      <button class="go" data-a="shclose" style="width:100%;margin-top:8px">বন্ধ করুন</button>
    </div></div>`;
    return;
  }

  if(sh.kind==='admins'){
    el.innerHTML=`<div class="ov" data-a="shx"><div class="sh">
      <b style="font-size:17px">👑 ইউজার সাইন-ইন অনুমোদন ও ম্যানেজমেন্ট</b>
      <p class="mut2">নিচে ইউজারদের তালিকা দেওয়া হলো। অনুমোদিত ইউজাররাই কেবল পূর্বের চ্যাট দেখা এবং অ্যাপ ব্যবহারের পূর্ণ এক্সেস পাবে।</p>
      ${err}<div id="adl" style="margin-top:10px"></div>
      <button class="ghost" data-a="shclose" style="width:100%;margin-top:10px">বন্ধ করুন</button>
    </div></div>`;
    adList();return;
  }

  if(sh.kind==='about'){
    const ab = cfgOf('about');
    const devN = ab.devName || DEV.name;
    const devP = ab.devPhone || DEV.phone;
    const devE = ab.devEmail || DEV.email;
    const devF = ab.devFb || DEV.facebook;
    const devPic = ab.devPhoto || DEV.photo;
    const devAbEng = ab.devAbout || DEV.aboutEng;

    el.innerHTML=`<div class="ov" data-a="shx"><div class="sh ab">
      <div style="text-align:center">
        <img src="icon-192.png" width="60" height="60" style="border-radius:14px">
        <div style="font-size:18px;font-weight:700;margin-top:4px">${esc(cfg().name||'গোপীনাথপুর স্পোর্টস')}</div>
      </div>
      
      <label style="margin-top:12px">About Apps (English)</label>
      <div class="card" style="font-size:13px;line-height:1.6;color:var(--tx)">${esc(devAbEng)}</div>

      <label>App Developer Information</label>
      <div class="card" style="display:flex;gap:12px;align-items:center">
        <img src="${esc(devPic)}" style="width:64px;height:64px;border-radius:50%;object-fit:cover" onerror="this.src='icon-192.png'">
        <div style="font-size:13px">
          <b>${esc(devN)}</b><br>
          📞 <a href="tel:${esc(devP)}" style="color:var(--a)">${esc(devP)}</a><br>
          ✉️ <a href="mailto:${esc(devE)}" style="color:var(--a)">${esc(devE)}</a><br>
          🔗 <a href="${esc(devF)}" target="_blank" style="color:var(--a)">Facebook Profile</a>
        </div>
      </div>

      ${S.owner||S.admin?`<button class="ghost" data-a="edabout" style="width:100%;margin-bottom:8px">✎ ডেভেলপার ও এবাউট ইনফো এডিট</button>`:''}
      <button class="go" data-a="shclose" style="width:100%">বন্ধ করুন</button>
    </div></div>`;
    return;
  }

  const def=FORMS[sh.col];
  const fld=def.f.map(([k,lb,ty,op])=>{
    const v=sh.d[k]==null?'':sh.d[k];
    if(ty==='sel')return `<label>${lb}</label><select id="sh-${k}">${op.map(o=>`<option value="${o[0]}" ${(v||op[0][0])===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
    if(ty==='area')return `<label>${lb}</label><textarea id="sh-${k}" rows="3">${esc(v)}</textarea>`;
    return `<label>${lb}</label><input id="sh-${k}" ${ty==='num'?'type="number"':''} value="${esc(v)}">`;
  }).join('');

  el.innerHTML=`<div class="ov" data-a="shx"><div class="sh"><b style="font-size:17px">${sh.id||def.doc?'✎ এডিট':'＋ নতুন'}</b>${fld}${err}
  <div class="bar2" style="margin-top:14px"><button class="ghost" data-a="shclose">বাতিল</button><button class="go" data-a="shsave">সেভ করুন</button></div></div></div>`;
}

function saveSheet(){
  const sh=S.sheet,def=FORMS[sh.col],o={};
  for(const [k,,ty] of def.f){const el=$('#sh-'+k);if(ty==='num'){const v=el.value.trim();o[k]=v===''?'':+v}else o[k]=el.value.trim()}
  const {col,id}=sh;S.sheet=null;sheet();
  write(async()=>{
    if(def.doc)await S.db.doc(def.doc).set(o);
    else if(id)await S.db.doc(col+'/'+id).update(o);
    else{o.ts=Date.now();await S.db.collection(col).add(o)}
  });
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
  
  if(a==='theme'){const r=document.documentElement,n=r.dataset.theme==='light'?'dark':'light';r.dataset.theme=n;ls.set('gs_th',n)}
  else if(a==='tab'){S.tab=v;formHtml();render();scrollTo(0,0)}
  else if(a==='sp'){S.sport=v;render()}
  else if(a==='login'){if(S.user){S.sheet={kind:'acct'};sheet()}else openLogin()}
  else if(a==='dogoogle'){S.google().catch(()=>toast('লগইন ব্যর্থ হয়েছে'))}
  else if(a==='dosignout'){S.sheet=null;sheet();S.signOut()}
  else if(a==='admins'&&S.admin){S.sheet={kind:'admins'};sheet()}
  else if(a==='appr'){write(()=>S.db.doc('users/'+b.dataset.uid).update({approved:true}))}
  else if(a==='remu'){write(()=>S.db.doc('users/'+b.dataset.uid).delete())}
  else if(a==='new')openSheet(b.dataset.c);
  else if(a==='edit')openSheet(b.dataset.c,id);
  else if(a==='esite')openSheet('settings','site');
  else if(a==='shclose'||a==='shx'){S.sheet=null;sheet()}
  else if(a==='shsave')saveSheet();
  else if(a==='g'){const m=S.matches.find(x=>x.id===id);if(m){const f=b.dataset.s,nv=Math.max(0,(m[f]||0)+(+b.dataset.d));write(()=>S.db.doc('matches/'+id).update({[f]:nv}))}}
  else if(a==='st')write(()=>S.db.doc('matches/'+id).update({status:v}));
  else if(a==='del'){const c=b.dataset.c;write(()=>S.db.doc(c+'/'+id).delete())}
  else if(a==='about'){S.sheet={kind:'about'};sheet()}
  else if(a==='edabout')openSheet('about');
  else if(a==='selp'){S.selectedPlayerAdmin=b.dataset.pid;render()}
  else if(a==='quickgoal'){
    const m=S.matches.find(x=>x.id===id);
    if(!m) return;
    const team = b.dataset.team;
    const p = S.players.find(x=>x.id===S.selectedPlayerAdmin);
    const pname = p?p.name:'অজানা প্লেয়ার';
    const minute = prompt('কত মিনিটে গোল হয়েছে?', '10') || '1';
    
    const newEv = {k:'goal',team,name:pname,min:+minute,ts:Date.now()};
    const upEvents = [...(m.events||[]), newEv];
    const upScore = team==='home'?(m.hs||0)+1:(m.as||0)+1;
    const scoreField = team==='home'?'hs':'as';

    write(()=>S.db.doc('matches/'+id).update({
      events: upEvents,
      [scoreField]: upScore,
      status: 'live'
    }));
  }
  else if(a==='chat')openChat('all');
  else if(a==='cclose'){S.cs.open=false;const c=$('#chat');if(c)c.remove();render()}
  else if(a==='csend'){
    const inp=$('#ci'),t=inp?inp.value.trim():'';
    if(t){sendChat(t);inp.value=''}
  }
});

/* ---------- ফায়ারবেস স্টার্ট ---------- */
(async()=>{
  document.documentElement.dataset.theme=ls.get('gs_th')||'dark';
  formHtml();render();
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=A.initializeApp(FIREBASE_CONFIG),auth=Au.getAuth(app);
    S.db=fsDb(F.getFirestore(app),F);
    S.google=()=>Au.signInWithPopup(auth,new Au.GoogleAuthProvider());
    S.signOut=()=>Au.signOut(auth);

    Au.onAuthStateChanged(auth,async u=>{
      S.user=u;
      if(u){
        S.me.id=u.uid;
        S.me.name=u.displayName||'';
        const em=u.email?u.email.toLowerCase():'';
        S.owner=OWNER.includes(em);
        
        // ইউজার রেকর্ড আপডেট ও তৈরি
        const uRef = S.db.doc('users/'+u.uid);
        const uDoc = await uRef.get();
        if(!uDoc){
          await uRef.set({email:em,name:u.displayName||'',approved:S.owner,ts:Date.now()});
          S.approved = S.owner;
        } else {
          S.approved = uDoc.approved || S.owner;
        }

        S.admin = S.owner || S.approved; // প্রয়োজন অনুযায়ী কাস্টম অ্যাডমিন চেক
        sub('users','users');
      } else {
        S.approved = false;
        S.admin = false;
      }
      formHtml();render();sheet();
    });

    sub('matches','matches');
    sub('notices','notices');
    sub('chat','chat');
    sub('players','players');
    sub('settings','settingsL');
  }catch(e){S.err='ইন্টারনেট সংযোগ চেক করুন';render()}
})();
</script></body></html>
