function fsDb(fs,F){

    onSnapshot:(ok,err)=>F.onSnapshot(F.query(F.collection(fs,c),...mods),ok,e=>err&&err({code:e.code})),
    add:o=>F.addDoc(F.collection(fs,c),o),
    doc:id=>({update:o=>F.updateDoc(F.doc(fs,c,id),o),delete:()=>F.deleteDoc(F.doc(fs,c,id)),set:o=>F.setDoc(F.doc(fs,c,id),o,{merge:true}),
      get:async()=>{const s=await F.getDoc(F.doc(fs,c,id));return s.exists()?s.data():null},
      react:(k,uid,on)=>F.updateDoc(F.doc(fs,c,id),{['reacts.'+k]:on?F.arrayUnion(uid):F.arrayRemove(uid)})})});
  return{collection:c=>mkq(c),doc:p=>{const[c,id]=p.split('/');return mkq(c).doc(id)}};
}

function diff(key,list){
  const first=!S.seen[key];S.seen[key]=1;if(first)return;const old=S[key];
  if(key==='matches')list.forEach(m=>{const o=old.find(x=>x.id===m.id),sc=m.home+' '+bn(m.hs||0)+'–'+bn(m.as||0)+' '+m.away;
    if(!o)push('🆕 নতুন ম্যাচ',m.home+' বনাম '+m.away+(m.when?' — '+m.when:''));
    else if(o.status!==m.status&&m.status==='live')push('🔴 ম্যাচ শুরু',sc);
    else if(o.status!==m.status&&m.status==='done')push('🏁 ম্যাচ শেষ',sc);
    else if((o.hs!==m.hs||o.as!==m.as)&&m.status!=='upcoming'){S.bump[m.id]=Date.now();push('⚽ স্কোর আপডেট',sc)}});
  if(key==='notices')list.forEach(n=>{if(!old.find(x=>x.id===n.id))push('📢 নতুন ঘোষণা',n.text)});
  if(key==='chat')list.forEach(c=>{if(!old.find(x=>x.id===c.id)&&c.uid!==S.me.id){
    if(S.cs.open&&S.cs.room===(c.room||'all'))return;
    push('💬 '+(c.name||'সদস্য'),c.text||'📷 ছবি',S.cs.open)}});
}

const dayL=ts=>{const d=new Date(ts),t=new Date(),k=x=>x.toDateString(),y=new Date(t-864e5);return k(d)===k(t)?'আজ':k(d)===k(y)?'গতকাল':d.toLocaleDateString(LOC,{day:'numeric',month:'long'})};
function msgHtml(x){
  const mine=x.uid&&x.uid===S.me.id,ph=safeUrl(x.photo),im=safeUrl(x.img);
  const av=ph?`<img class="av" src="${esc(ph)}" referrerpolicy="no-referrer" alt="">`:`<div class="av">${esc((x.name||'?').trim().charAt(0))}</div>`;
  const txt=esc(x.text||'').replace(/@([^\s@]+)/g,'<span class="mn">@$1</span>');
  const rq=x.reply?`<div class="rq"><b>${esc(x.reply.name)}</b>${esc(x.reply.text)}</div>`:'';
  const rxs=RX.map(([k,e])=>{const l=(x.reacts&&x.reacts[k])||[];return `<button class="rx ${l.includes(S.me.id)?'on':''}" data-a="react" data-id="${x.id}" data-k="${k}">${e}${l.length?' '+bn(l.length):''}</button>`}).join('');
  const tm=new Date(x.ts||Date.now()).toLocaleTimeString(LOC,{hour:'numeric',minute:'2-digit'});
  return `<div class="m ${mine?'me':''}">${av}<div class="mb"><span class="nm" data-a="mention" data-n="${esc(x.name||'')}">${esc(x.name||'সদস্য')}</span>${rq}${txt?`<div>${txt}</div>`:''}${im?`<img class="mi" src="${im}" alt="">`:''}

}

  const room=S.cs.room,ms=S.chat.filter(c=>(c.room||'all')===room).sort((a,b)=>a.ts-b.ts),m=S.matches.find(x=>x.id===room);
  $('#ct').textContent=room==='all'?'💬 গ্রামের গ্রুপ চ্যাট':(m?m.home+' বনাম '+m.away:'ম্যাচ চ্যাট');
